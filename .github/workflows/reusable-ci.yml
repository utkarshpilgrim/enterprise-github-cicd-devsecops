name: Reusable Python CI
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      run-security:
        type: boolean
        default: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest --cov

  security:
    if: ${{ inputs.run-security }}
    uses: ./.github/workflows/full-devsecops.yml
